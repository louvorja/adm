name: deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout code
        uses: actions/checkout@v3
        with:
          # O token só aparece no passo do push: `npm ci` roda scripts de terceiros.
          persist-credentials: false
      - name: set up node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
      - name: fetch CNAME from dist branch
        run: |
          git fetch origin dist:dist
          git show dist:CNAME > CNAME || echo "CNAME not found, skipping"
      - name: install dependencies
        run: npm ci
      - name: test
        run: npm test
      - name: build project
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE_URL: /
      - name: copy CNAME to dist (if exists)
        run: |
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          fi
      - name: copy index.html to 404.html
        run: |
          cp dist/index.html dist/404.html
      - name: deploy to dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git checkout -b dist  # Cria a branch dist se não existir
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🚀 Deploy id ${GITHUB_RUN_ID}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin dist  # Faz push forçado para a branch dist
